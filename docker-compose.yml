name: denver-skyimage

services:
  capture:
    build: ./capture
    image: valhalla:5000/denver-skyimage-capture:latest
    restart: unless-stopped
    volumes:
      - ./config.yaml:/config/config.yaml:ro,z
      - ./cameras.json:/config/cameras.json:ro,z
      - ./downloaded_images:/data/images:z

  web:
    build: ./web
    image: valhalla:5000/denver-skyimage-web:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    security_opt:
      - label=disable
    volumes:
      - ./cameras.json:/config/cameras.json:ro,z
      - ./config.yaml:/config/config.yaml:ro,z
      - ./downloaded_images:/data/images:z
      - ./events:/data/events:z
      - ./videos:/data/videos:z
      - ${ENGINE_SOCK_HOST}:${ENGINE_SOCK_CONTAINER}:ro

  videogen:
    build: ./videogen
    image: valhalla:5000/denver-skyimage-videogen:latest
    restart: unless-stopped
    volumes:
      - ./cameras.json:/config/cameras.json:ro,z
      - ./downloaded_images:/data/images:ro,z
      - ./videos:/data/videos:z
