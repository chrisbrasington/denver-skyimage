<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denver Sky</title>
<style>
  body { margin: 0; background: #0b0d12; color: #e6e9ef; font-family: system-ui, sans-serif; }
  header { padding: 0.6rem 1rem; display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid #222; flex-wrap: wrap; }
  header a { color: #8ab4ff; text-decoration: none; font-size: 0.9rem; }
  header a:hover { text-decoration: underline; }
  header .spacer { flex: 1; }
  main { padding: 1rem; max-width: 1400px; margin: 0 auto; }
  h1 { margin: 0 0 1rem; font-size: 1rem; color: #8ab4ff; text-transform: uppercase; letter-spacing: 0.08em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
  .card { background: #11141c; border: 1px solid #222; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
  .card .thumb { background: #000; aspect-ratio: 4/3; display: block; position: relative; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .thumb .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #556; font-size: 0.85rem; }
  .card .meta { padding: 0.6rem 0.9rem 0.3rem; display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
  .card .name { font-size: 1.05rem; font-weight: 600; color: #ffd76a; text-transform: capitalize; }
  .card .ts { font-size: 0.75rem; color: #aab; font-variant-numeric: tabular-nums; }
  .card .touch-ranges { display: flex; flex-direction: column; gap: 0.4rem; padding: 0.4rem 0.6rem 0; }
  .card .touch-ranges a { background: #2a3a55; border: 1px solid #3a557d; color: #cfe0ff; border-radius: 4px; padding: 0.55rem 0.5rem; text-align: center; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
  .card .touch-ranges a:hover { background: #34466a; }
  .card .touch-ranges .empty { color: #788; text-align: center; font-size: 0.8rem; padding: 0.4rem; }
  .card .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; padding: 0.4rem 0.6rem 0.7rem; }
  .card .actions a { background: #1f2630; color: #e6e9ef; border: 1px solid #333; border-radius: 4px; padding: 0.5rem 0.4rem; text-align: center; text-decoration: none; font-size: 0.82rem; }
  .card .actions a:hover { background: #2a3340; }
  .card .actions a.primary { background: #2a3a55; border-color: #3a557d; color: #cfe0ff; }
  .card .actions a.primary:hover { background: #34466a; }
  .empty { padding: 2rem; color: #788; text-align: center; }

  .pair-banner { display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 1rem; background: #11141c; border-bottom: 1px solid #222; flex-wrap: wrap; }
  .pair-banner .label { font-size: 0.95rem; color: #aab; }
  .pair-banner .label strong { color: #ffd76a; font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }
  .pair-banner .spacer { flex: 1; }
  .pair-banner button { background: #2a5a3a; color: #cfffd9; border: 1px solid #3a7d55; border-radius: 4px; padding: 0.55rem 1.1rem; font-size: 0.95rem; cursor: pointer; font-family: inherit; }
  .pair-banner button:active { background: #346a4a; }
  .pair-banner button.unpair { background: #3a2630; color: #f7b7b7; border-color: #5a3340; }
  .pair-banner button.unpair:active { background: #4a3340; }
  .pair-banner .badge { background: #14241a; color: #7fd17a; padding: 0.2rem 0.55rem; border-radius: 4px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .pair-banner .badge.not { background: #1c2030; color: #aab; }

  .pair-overlay { position: fixed; inset: 0; z-index: 90; background: rgba(5,7,12,0.75); display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .pair-overlay.hidden { display: none; }
  .pair-modal { background: #11141c; border: 1px solid #2a3340; border-radius: 10px; padding: 1.1rem 1.2rem 1.2rem; width: min(520px, 100%); max-height: 90vh; display: flex; flex-direction: column; gap: 0.8rem; }
  .pair-modal .head { display: flex; align-items: center; gap: 1rem; }
  .pair-modal .head strong { font-size: 1.1rem; color: #8ab4ff; text-transform: uppercase; letter-spacing: 0.08em; flex: 1; }
  .pair-modal .head button { background: transparent; color: #aab; border: 1px solid #333; border-radius: 4px; padding: 0.35rem 0.7rem; font-size: 1.2rem; cursor: pointer; font-family: inherit; }
  .pair-modal .head button:active { background: #1f2630; }
  .tv-list { overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding-right: 0.2rem; }
  .tv-row { display: flex; align-items: center; gap: 0.9rem; padding: 0.8rem 1rem; background: #161a26; border: 1px solid #2a3340; border-radius: 6px; cursor: pointer; transition: background 0.1s, border-color 0.1s; }
  .tv-row:hover { background: #1f2630; border-color: #4a6da0; }
  .tv-row:active { background: #2a3340; }
  .tv-row.disabled { cursor: default; opacity: 0.55; }
  .tv-row .code { font-size: 1.8rem; font-weight: 800; color: #ffd76a; font-variant-numeric: tabular-nums; letter-spacing: 0.12em; min-width: 5ch; }
  .tv-row .info { flex: 1; display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
  .tv-row .id { font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; color: #788; }
  .tv-row .state { font-size: 0.8rem; color: #aab; }
  .tv-row .arrow { color: #4a6da0; font-size: 1.4rem; }
  .pair-modal .modal-empty { padding: 1rem; text-align: center; color: #788; font-size: 0.9rem; }
  .pair-modal .modal-empty a { color: #8ab4ff; }
  .pair-modal .hint { color: #788; font-size: 0.78rem; text-align: center; }
</style>
</head>
<body>
<header>
  <strong>Denver Sky</strong>
  <span class="spacer"></span>
  <a href="/browse">Browse</a>
  <a href="/events">Events</a>
  <a href="/connect">Connect</a>
  <a href="/tv">TV</a>
  <a href="/status">Status</a>
</header>
<div class="pair-banner" id="pairBanner">
  <span class="badge not" id="pairBadge">Not paired</span>
  <span class="label" id="pairLabel">Pair this device to a TV to mirror playback.</span>
  <span class="spacer"></span>
  <button id="pairBtn">Pair with TV</button>
  <button id="unpairBtn" class="unpair" style="display:none;">Unpair</button>
</div>
<div class="pair-overlay hidden" id="pairOverlay">
  <div class="pair-modal">
    <div class="head">
      <strong>Pick a TV</strong>
      <button id="pairCloseBtn" aria-label="close">×</button>
    </div>
    <div id="tvList" class="tv-list"><div class="modal-empty">scanning…</div></div>
    <div class="hint">No TVs? Open <strong>/tv</strong> on a display, then refresh this list.</div>
  </div>
</div>
<main>
  <h1>Cameras</h1>
  <div class="grid" id="grid"></div>
  {% if not cameras %}
  <div class="empty">No cameras configured.</div>
  {% endif %}
</main>
<script>
const CAMERAS = {{ cameras | tojson }};
const grid = document.getElementById('grid');

function imgUrl(cam, name) {
  return `/image/${encodeURIComponent(name)}?camera=${encodeURIComponent(cam)}`;
}

function fmtTs(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('en-US', { timeZone: 'America/Denver', hour12: false });
  } catch (e) { return iso; }
}

function cardFor(cam) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <a class="thumb" href="/touch/${encodeURIComponent(cam)}">
      <div class="ph" data-ph>loading…</div>
    </a>
    <div class="meta">
      <span class="name">${cam}</span>
      <span class="ts" data-ts></span>
    </div>
    <div class="touch-ranges" data-ranges>
      <div class="empty">loading days…</div>
    </div>
    <div class="actions">
      <a href="/touch/${encodeURIComponent(cam)}/last-hour">Last hour</a>
      <a href="/last/${encodeURIComponent(cam)}">Last image</a>
      <a href="/camera/${encodeURIComponent(cam)}">Admin / TV</a>
      <a href="/browse/${encodeURIComponent(cam)}">Browse</a>
    </div>
  `;
  return card;
}

const WD_FMT = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Denver', weekday: 'short' });
const MD_FMT = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Denver', month: 'short', day: 'numeric' });

function parseDay(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function rangeLabel(days, latestDay) {
  const todayWd = WD_FMT.format(latestDay);
  if (days === 1) return `Today (${todayWd})`;
  const start = new Date(latestDay);
  start.setDate(start.getDate() - (days - 1));
  if (days <= 6) return `${WD_FMT.format(start)} – Today (${todayWd})`;
  return `${MD_FMT.format(start)} – Today (${todayWd})`;
}

async function renderRanges(cam, card) {
  const box = card.querySelector('[data-ranges]');
  try {
    const r = await fetch(`/api/days?camera=${encodeURIComponent(cam)}`, { cache: 'no-store' });
    if (!r.ok) { box.innerHTML = `<div class="empty">no days</div>`; return; }
    const data = await r.json();
    if (!data.length) { box.innerHTML = `<div class="empty">no images yet</div>`; return; }
    const latestDay = parseDay(data[0].day);
    box.innerHTML = '';
    for (let n = 1; n <= data.length; n++) {
      const a = document.createElement('a');
      a.href = `/touch/${encodeURIComponent(cam)}?days=${n}`;
      a.textContent = rangeLabel(n, latestDay);
      box.appendChild(a);
    }
  } catch (e) {
    box.innerHTML = `<div class="empty">error</div>`;
  }
}

async function refreshThumb(cam, card) {
  try {
    const r = await fetch(`/api/latest/${encodeURIComponent(cam)}`, { cache: 'no-store' });
    const thumb = card.querySelector('.thumb');
    const ph = card.querySelector('[data-ph]');
    const ts = card.querySelector('[data-ts]');
    if (!r.ok) {
      if (ph) ph.textContent = r.status === 404 ? 'no images yet' : `error ${r.status}`;
      return;
    }
    const data = await r.json();
    let img = thumb.querySelector('img');
    if (!img) {
      img = document.createElement('img');
      thumb.appendChild(img);
    }
    img.src = imgUrl(cam, data.name);
    img.alt = `${cam} latest`;
    if (ph) ph.remove();
    if (ts) ts.textContent = fmtTs(data.ts);
  } catch (e) {
    const ph = card.querySelector('[data-ph]');
    if (ph) ph.textContent = 'error';
  }
}

for (const cam of CAMERAS) {
  const card = cardFor(cam);
  grid.appendChild(card);
  refreshThumb(cam, card);
  renderRanges(cam, card);
  setInterval(() => refreshThumb(cam, card), 30_000);
  setInterval(() => renderRanges(cam, card), 5 * 60_000);
}

// ── Controller (touch-session) pair UI ──
const CONTROLLER_KEY = 'controller_id';
let CONTROLLER_ID = null;
try { CONTROLLER_ID = localStorage.getItem(CONTROLLER_KEY); } catch {}
let pairedTvId = null;
let pairedTvSeenCode = null;

const badgeEl = document.getElementById('pairBadge');
const labelEl = document.getElementById('pairLabel');
const pairBtn = document.getElementById('pairBtn');
const unpairBtn = document.getElementById('unpairBtn');
const overlay = document.getElementById('pairOverlay');
const overlayClose = document.getElementById('pairCloseBtn');
const tvListEl = document.getElementById('tvList');

async function registerController() {
  try {
    const r = await fetch('/api/sessions/touch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: CONTROLLER_ID || null }),
    });
    if (!r.ok) return;
    const data = await r.json();
    CONTROLLER_ID = data.id;
    pairedTvId = data.paired_tv_id || null;
    try { localStorage.setItem(CONTROLLER_KEY, CONTROLLER_ID); } catch {}
    renderPairState();
  } catch (e) { console.warn('controller register failed', e); }
}

function controllerHeartbeat() {
  if (!CONTROLLER_ID) return;
  fetch(`/api/sessions/touch/${CONTROLLER_ID}/heartbeat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    keepalive: true,
    body: '{}',
  }).catch(() => {});
}

function renderPairState() {
  if (pairedTvId) {
    badgeEl.textContent = 'Paired';
    badgeEl.classList.remove('not');
    labelEl.innerHTML = pairedTvSeenCode
      ? `TV <strong>${pairedTvSeenCode}</strong> (<span style="font-family:monospace">${pairedTvId.slice(0, 8)}</span>) — tap a touch link below to drive it.`
      : `TV <strong>${pairedTvId.slice(0, 8)}</strong> — tap a touch link below to drive it.`;
    pairBtn.style.display = 'none';
    unpairBtn.style.display = '';
  } else {
    badgeEl.textContent = 'Not paired';
    badgeEl.classList.add('not');
    labelEl.textContent = 'Pair this device to a TV to mirror playback.';
    pairBtn.style.display = '';
    unpairBtn.style.display = 'none';
  }
}

async function fetchSessions() {
  try {
    const r = await fetch('/api/sessions', { cache: 'no-store' });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function refreshPairStatus() {
  const data = await fetchSessions();
  if (!data) return;
  const me = (data.touches || []).find(t => t.id === CONTROLLER_ID);
  pairedTvId = me?.paired_tv_id || null;
  if (pairedTvId) {
    const tv = (data.tvs || []).find(t => t.id === pairedTvId);
    pairedTvSeenCode = tv?.pairing_code || pairedTvSeenCode;
  } else {
    pairedTvSeenCode = null;
  }
  renderPairState();
  if (!overlay.classList.contains('hidden')) renderTvList(data);
}

function renderTvList(data) {
  const tvs = data.tvs || [];
  tvListEl.innerHTML = '';
  if (!tvs.length) {
    tvListEl.innerHTML = `<div class="modal-empty">No TVs registered. Open <a href="/tv" target="_blank">/tv</a> on a display and try again.</div>`;
    return;
  }
  for (const tv of tvs) {
    const row = document.createElement('div');
    row.className = 'tv-row';
    const codeText = tv.pairing_code || '----';
    const stateText = tv.paired_touch_id
      ? (tv.paired_touch_id === CONTROLLER_ID ? 'paired with this device' : `paired with another (${tv.paired_touch_id.slice(0, 6)})`)
      : 'awaiting pair';
    row.innerHTML = `
      <div class="code">${codeText}</div>
      <div class="info">
        <div class="id">${tv.id.slice(0, 12)}</div>
        <div class="state">${stateText}</div>
      </div>
      <div class="arrow">›</div>`;
    if (tv.paired_touch_id === CONTROLLER_ID) {
      row.classList.add('disabled');
    } else {
      row.addEventListener('click', () => pairWith(tv.id));
    }
    tvListEl.appendChild(row);
  }
}

async function openPairOverlay() {
  overlay.classList.remove('hidden');
  tvListEl.innerHTML = `<div class="modal-empty">scanning…</div>`;
  const data = await fetchSessions();
  if (data) renderTvList(data);
}

function closePairOverlay() {
  overlay.classList.add('hidden');
}

async function pairWith(tvId) {
  if (!CONTROLLER_ID) return;
  try {
    const r = await fetch('/api/sessions/pair-tv', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ touch_id: CONTROLLER_ID, tv_id: tvId }),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      alert(j.detail || `pair failed (${r.status})`);
      return;
    }
  } catch (e) {
    alert('network error');
    return;
  }
  closePairOverlay();
  await refreshPairStatus();
}

async function unpairSelf() {
  if (!CONTROLLER_ID) return;
  try {
    await fetch('/api/sessions/unpair', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ touch_id: CONTROLLER_ID }),
    });
  } catch {}
  await refreshPairStatus();
}

pairBtn.addEventListener('click', openPairOverlay);
unpairBtn.addEventListener('click', unpairSelf);
overlayClose.addEventListener('click', closePairOverlay);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closePairOverlay(); });

(async () => {
  await registerController();
  await refreshPairStatus();
  setInterval(controllerHeartbeat, 10000);
  setInterval(refreshPairStatus, 3000);
})();
</script>
<script src="/static/admin-keypad.js"></script>
<script src="/static/hard-refresh.js"></script>
</body>
</html>
