{% extends "_base.html" %}

{% block title %}Browse — Denver Sky{% endblock %}

{% block page_css %}<link rel="stylesheet" href="/static/css/pages/browse.css">{% endblock %}

{% block admin_gate %}{% include "_admin_gate.html" %}{% endblock %}

{% block content %}
<header class="app-header">
  <strong>Denver Sky</strong>
  <a href="/">Live</a>
  <a href="/browse" class="here">Browse</a>
  <label>Jump to <select id="jump"><option value="">Newest first</option></select></label>
  <span id="counter" style="margin-left:auto;color:#888;"></span>
</header>

<div class="grid" id="grid"></div>
<div class="status" id="status">loading…</div>
{% endblock %}

{% block scripts %}
<script>
  window.__SKY = { camera: {{ camera_name | tojson }} };
</script>
<script src="/static/js/pages/browse.js"></script>
<script src="/static/js/lib/hard-refresh.js"></script>
{% endblock %}
