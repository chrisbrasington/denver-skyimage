{% extends "_base.html" %}

{% block title %}Denver Sky — Last Image{% endblock %}

{% block viewport %}width=device-width, initial-scale=1, user-scalable=no{% endblock %}

{% block page_css %}<link rel="stylesheet" href="/static/css/pages/last-player.css">{% endblock %}

{% block content %}
<div class="stage" id="stage">
  <img id="frame" alt="sky" draggable="false">
  <div class="time-label" aria-hidden="true">
    <span class="descriptor" id="timeDescriptor">--</span>
    <span class="ts" id="timeTs">--</span>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.__SKY = { camera: {{ camera_name | tojson }} };
</script>
<script src="/static/js/lib/playback.js"></script>
<script src="/static/js/lib/controller.js"></script>
<script src="/static/js/pages/last-live.js"></script>
<script src="/static/js/lib/admin-keypad.js"></script>
<script src="/static/js/lib/hard-refresh.js"></script>
{% endblock %}
