{% extends "_base.html" %}

{% block title %}Denver Sky — Connect{% endblock %}

{% block page_css %}<link rel="stylesheet" href="/static/css/pages/connect.css">{% endblock %}

{% block content %}
<header class="app-header">
  <strong>Denver Sky</strong>
  <a href="/">Home</a>
  <a href="/status">Status</a>
  <span class="spacer"></span>
  <strong>Connect</strong>
</header>

<main>
  <section class="panel">
    <h2>Touch Sessions</h2>
    <div id="touches"><div class="empty">loading…</div></div>
  </section>
  <section class="panel">
    <h2>TVs</h2>
    <div id="tvs"><div class="empty">loading…</div></div>
  </section>
</main>

<div class="pair-bar">
  <input id="codeInput" inputmode="numeric" maxlength="5" placeholder="code" autocomplete="off">
  <select id="touchSelect"><option value="">— pick touch —</option></select>
  <button id="pairBtn">Pair</button>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/lib/admin-keypad.js"></script>
<script src="/static/js/lib/connect.js"></script>
<script src="/static/js/lib/hard-refresh.js"></script>
{% endblock %}
