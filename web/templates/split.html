<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Denver Sky — Split</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #e6e9ef; font-family: system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.75rem; border-bottom: 1px solid #222; background: #0b0d12; flex-wrap: wrap; }
  .topbar a { color: #8ab4ff; text-decoration: none; font-size: 0.9rem; }
  .topbar a:hover { text-decoration: underline; }
  .topbar .spacer { flex: 1; }
  .topbar select { background: #1f2630; color: #e6e9ef; border: 1px solid #444; border-radius: 6px; padding: 0.45rem 0.6rem; font-size: 0.95rem; font-family: inherit; }
  .topbar label { font-size: 0.85rem; color: #aab; text-transform: uppercase; letter-spacing: 0.06em; }
  .topbar .swap { background: #1f2630; color: #ffd76a; border: 1px solid #444; border-radius: 6px; padding: 0.45rem 0.7rem; cursor: pointer; font-size: 1.1rem; font-family: inherit; }
  .topbar .swap:active { background: #2a3340; }
  .topbar .mirror { background: #14241a; color: #7fd17a; border: 1px solid #2a5a3a; border-radius: 6px; padding: 0.45rem 0.7rem; cursor: pointer; font-size: 0.9rem; font-family: inherit; display: none; align-items: center; gap: 0.4rem; }
  .topbar .mirror.show { display: inline-flex; }
  .topbar .mirror:active { background: #1c3024; }
  .topbar .mirror .dot { width: 8px; height: 8px; border-radius: 50%; background: #7fd17a; box-shadow: 0 0 6px #7fd17a; }
  .stage.mirroring { outline: 3px solid #7fd17a; outline-offset: -3px; }

  .main { flex: 1; display: flex; align-items: stretch; min-height: 0; }
  .sidebar { position: relative; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; gap: 0.5rem; padding: 0.75rem 0 0.75rem 0.75rem; min-width: 13rem; max-width: 16rem; overflow-y: auto; }
  .sidebar button { width: calc(100% - 10px); text-align: left; font-size: 0.95rem; padding: 0.7rem 0.85rem; min-width: 0; background: #1f2630; color: #e6e9ef; border: 2px solid #444; border-radius: 8px; cursor: pointer; transition: transform 0.18s ease-out, filter 0.18s ease-out; white-space: pre-line; font-family: inherit; }
  .sidebar button.active { transform: translateX(10px); filter: brightness(1.25); }
  .sidebar .preset-everything { background: #2a3b5a; }
  .sidebar .preset-today { background: #2d4a2d; }
  .sidebar .preset-sunrise { border-color: #d6a14b; }
  .sidebar .preset-day { border-color: #6a7c8a; }
  .sidebar .preset-sunset { border-color: #c2614e; }
  .sidebar .preset-night { border-color: #3a4f7a; background: #161a26; }

  .stages { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 0 0.5rem; min-width: 0; min-height: 0; }
  .stage { position: relative; display: flex; justify-content: center; align-items: center; background: #0b0d12; min-height: 0; min-width: 0; overflow: hidden; }
  .stage img { width: 100%; height: 100%; object-fit: contain; box-shadow: 0 0 20px #000; -webkit-user-drag: none; pointer-events: none; }
  .stage .cam-label { position: absolute; top: 0.6rem; left: 0.6rem; background: rgba(10,15,20,0.6); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 0.3rem 0.7rem; color: #ffd76a; font-weight: 700; font-size: 1.1rem; text-transform: capitalize; letter-spacing: 0.04em; backdrop-filter: blur(4px); }
  .stage .ts-label { position: absolute; bottom: 0.6rem; right: 0.6rem; background: rgba(10,15,20,0.6); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 0.4rem 0.7rem; color: #fff; font-size: 1rem; font-variant-numeric: tabular-nums; backdrop-filter: blur(4px); }
  .stage .ts-label.stale { color: #f7b7b7; border-color: rgba(255,120,120,0.4); }
  .stage .empty { color: #788; font-size: 0.95rem; }

  .bottombar { background: #0b0d12; border-top: 2px solid #222; padding: 0.85rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.7rem; }
  .row { display: flex; gap: 1rem; align-items: center; }
  .row .slot { flex: 1; min-width: 0; }
  .slabel { font-size: 1rem; color: #8ab4ff; min-width: 6rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  button.action { background: #1f2630; color: #e6e9ef; border: 2px solid #444; padding: 0.6rem 1.1rem; border-radius: 8px; cursor: pointer; font-size: 1rem; min-width: 5rem; font-family: inherit; }
  button.action:active { background: #2a3340; }
  .ts { font-variant-numeric: tabular-nums; font-size: 1rem; }

  .rangebar { width: 100%; }
  .rangebar .ticks { display: flex; justify-content: space-between; font-size: 0.95rem; color: #aab; margin-bottom: 0.3rem; font-variant-numeric: tabular-nums; font-weight: 600; }
  .rangebar .anchors { position: relative; height: 18px; font-size: 0.78rem; color: #99a; font-variant-numeric: tabular-nums; pointer-events: none; }
  .rangebar .anchors span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .rangebar .dual { position: relative; height: 44px; touch-action: none; cursor: pointer; }
  .rangebar .track { position: absolute; top: 18px; left: 0; right: 0; height: 8px; background: #1f2630; border-radius: 4px; pointer-events: none; }
  .rangebar .selected { position: absolute; top: 0; height: 100%; background: transparent; border-radius: 4px; box-shadow: 0 -3px 0 #ffd76a, 0 3px 0 #ffd76a; pointer-events: none; }
  .rangebar .daymarks { position: absolute; top: 12px; left: 0; right: 0; height: 20px; pointer-events: none; }
  .rangebar .daymarks span { position: absolute; top: 0; width: 2px; height: 20px; background: #455; }
  .rangebar .sunmarks { position: absolute; top: 12px; left: 0; right: 0; height: 20px; pointer-events: none; }
  .rangebar .sunmarks span { position: absolute; top: 0; width: 3px; height: 20px; transform: translateX(-50%); }
  .rangebar .sunmarks span.sr { background: #d6a14b; box-shadow: 0 0 5px rgba(214,161,75,0.8); }
  .rangebar .sunmarks span.ss { background: #c2614e; box-shadow: 0 0 5px rgba(194,97,78,0.8); }
  .rangebar .anchors span.sr-label { color: #d6a14b; font-weight: 600; }
  .rangebar .anchors span.ss-label { color: #c2614e; font-weight: 600; }
  .rangebar .thumb { position: absolute; top: 6px; width: 28px; height: 28px; border-radius: 50%; background: var(--thumb-color, #e6e9ef); border: 3px solid #ffd76a; box-shadow: 0 0 0 2px rgba(0,0,0,0.6); transform: translateX(-50%); pointer-events: none; z-index: 2; }
  .rangebar .playhead { position: absolute; top: 0; width: 6px; height: 40px; background: var(--thumb-color, #ffd76a); border-radius: 3px; box-shadow: 0 0 0 2px #000, 0 0 10px rgba(255,215,106,1); transform: translateX(-50%); pointer-events: none; z-index: 3; }
  .thumb-tooltip { position: fixed; transform: translate(-50%, calc(-100% - 50px)); background: rgba(20,24,32,0.97); color: #e6e9ef; padding: 0.55rem 1rem; border-radius: 8px; font-size: 1.05rem; font-weight: 600; white-space: nowrap; pointer-events: none; z-index: 1000; display: none; border: 2px solid #8ab4ff; box-shadow: 0 4px 18px rgba(0,0,0,0.7); font-variant-numeric: tabular-nums; }
  .thumb-tooltip.show { display: block; }

  @media (max-width: 900px) {
    .main { flex-direction: column; }
    .sidebar { flex-direction: row; overflow-x: auto; overflow-y: hidden; min-width: 0; max-width: none; padding: 0.5rem; justify-content: flex-start; }
    .sidebar button { width: auto; min-width: 8rem; }
    .stages { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 2px; padding: 0 0.25rem; }
  }

  .stages { cursor: pointer; }
  .stages:fullscreen { padding: 0; background: #000; gap: 2px; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  .stages:fullscreen .stage { background: #000; }
  .stages:fullscreen .stage img { width: 100%; height: 100vh; object-fit: contain; box-shadow: none; }
  .stages:fullscreen .cam-label { font-size: 1.4rem; padding: 0.4rem 0.9rem; top: 1rem; left: 1rem; }
  .stages:fullscreen .ts-label { font-size: 1.3rem; padding: 0.55rem 0.9rem; bottom: 1rem; right: 1rem; }
</style>
</head>
<body>
<div class="topbar">
  <strong style="color:#8ab4ff;letter-spacing:0.05em;">SPLIT</strong>
  <a href="/">← Cameras</a>
  <span class="spacer"></span>
  <label for="leftSel">Left:</label>
  <select id="leftSel"></select>
  <button class="swap" id="swapBtn" title="Swap cameras">⇄</button>
  <label for="rightSel">Right:</label>
  <select id="rightSel"></select>
  <button class="mirror" id="mirrorBtn" title="Swap which camera mirrors to TV"><span class="dot"></span><span id="mirrorLabel">Mirror: --</span> ⇄</button>
</div>
<div class="thumb-tooltip" id="thumbTooltip"></div>
<div class="main">
  <div class="sidebar" id="rangePresets"></div>
  <div class="stages">
    <div class="stage" id="stageL">
      <div class="cam-label" id="labelL">{{ left }}</div>
      <img id="frameL" alt="left" draggable="false">
      <div class="ts-label" id="tsL">--</div>
    </div>
    <div class="stage" id="stageR">
      <div class="cam-label" id="labelR">{{ right }}</div>
      <img id="frameR" alt="right" draggable="false">
      <div class="ts-label" id="tsR">--</div>
    </div>
  </div>
</div>
<div class="bottombar">
  <div class="row">
    <span class="slabel">Timeline</span>
    <div class="slot">
      <div class="rangebar">
        <div class="ticks">
          <span id="rangeStartLabel">--</span>
          <span id="rangeEndLabel">--</span>
        </div>
        <div class="anchors" id="anchorLabels"></div>
        <div class="dual" id="dual">
          <div class="track"><div class="selected" id="selBar"></div></div>
          <div class="daymarks" id="dayMarks"></div>
          <div class="sunmarks" id="sunMarks"></div>
          <div class="thumb" id="thumbLo"></div>
          <div class="thumb" id="thumbHi"></div>
          <div class="playhead" id="playhead"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <button class="action" id="playBtn">Pause</button>
    <span class="ts" id="currentTsLabel">--</span>
  </div>
</div>
<script src="/static/playback.js"></script>
<script src="/static/controller.js"></script>
<script>
const SP = window.SkyPlayback;
const { imgUrl: _imgUrl, thumbUrl: _thumbUrl, fmtTsHuman, fmtMD, fmt12hm, hhmmToMin,
        timeColor, buildGradientFor, PreloadCache } = SP;

const LEFT = {{ left | tojson }};
const RIGHT = {{ right | tojson }};
const DAYS = {{ days | tojson }};
const ALL_CAMS = {{ cameras | tojson }};

const TICK_MS = 100;
const ADVANCE_SEC = 30;
const NEAR_TOL_SEC = 240;

const dual = document.getElementById('dual');
const thumbLo = document.getElementById('thumbLo');
const thumbHi = document.getElementById('thumbHi');
const playhead = document.getElementById('playhead');
const selBar = document.getElementById('selBar');
const dayMarks = document.getElementById('dayMarks');
const sunMarks = document.getElementById('sunMarks');
const anchorLabels = document.getElementById('anchorLabels');
const rangePresets = document.getElementById('rangePresets');
const thumbTooltip = document.getElementById('thumbTooltip');
const rangeStartLabel = document.getElementById('rangeStartLabel');
const rangeEndLabel = document.getElementById('rangeEndLabel');
const currentTsLabel = document.getElementById('currentTsLabel');
const playBtn = document.getElementById('playBtn');
const leftSel = document.getElementById('leftSel');
const rightSel = document.getElementById('rightSel');
const swapBtn = document.getElementById('swapBtn');

const cams = [
  { name: LEFT,  frames: [], cache: new PreloadCache({ camera: LEFT,  ahead: 60, behind: 30, cap: 600 }),
    imgEl: document.getElementById('frameL'), tsEl: document.getElementById('tsL'),
    stageEl: document.getElementById('stageL'), lastShownIdx: -1 },
  { name: RIGHT, frames: [], cache: new PreloadCache({ camera: RIGHT, ahead: 60, behind: 30, cap: 600 }),
    imgEl: document.getElementById('frameR'), tsEl: document.getElementById('tsR'),
    stageEl: document.getElementById('stageR'), lastShownIdx: -1 },
];

let unionLoTs = 0, unionHiTs = 0;
let userLoTs = 0, userHiTs = 0;
let currentTs = 0;
let playing = true;
let dragging = false;
let activeDrag = null;
let sunTimes = {};
let activePresetLabel = null;
let _showToken = 0;

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function buildSinceParam() {
  if (DAYS <= 0) return null;
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (DAYS - 1));
  return `${start.getFullYear()}-${pad2(start.getMonth() + 1)}-${pad2(start.getDate())}_00-00-00`;
}

function imgUrlFor(name, cam) { return _imgUrl(name, cam); }
function thumbUrlFor(name, cam) { return _thumbUrl(name, cam); }

function nearestIdx(frames, tsMs) {
  if (!frames.length) return -1;
  let lo = 0, hi = frames.length - 1;
  while (lo < hi) {
    const m = (lo + hi) >> 1;
    if (frames[m].tsMs < tsMs) lo = m + 1; else hi = m;
  }
  if (lo > 0 && Math.abs(frames[lo-1].tsMs - tsMs) < Math.abs(frames[lo].tsMs - tsMs)) lo--;
  return lo;
}

function tsPct(tsMs) {
  const span = unionHiTs - unionLoTs;
  if (span <= 0) return 0;
  return Math.max(0, Math.min(100, ((tsMs - unionLoTs) / span) * 100));
}

function pctToTs(pct) {
  return unionLoTs + (pct / 100) * (unionHiTs - unionLoTs);
}

async function loadCamFrames(c) {
  const since = buildSinceParam();
  const base = since ? `/api/frames?since=${encodeURIComponent(since)}` : '/api/frames';
  const url = `${base}${base.includes('?') ? '&' : '?'}camera=${encodeURIComponent(c.name)}`;
  try {
    const r = await fetch(url);
    const data = await r.json();
    c.frames = data.map(f => ({ ...f, tsMs: Date.parse(f.ts) })).filter(f => !isNaN(f.tsMs));
    c.cache.setFrames(c.frames);
    if (!c.frames.length) {
      c.stageEl.querySelector('.empty')?.remove();
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'no frames yet';
      c.stageEl.appendChild(e);
    } else {
      c.stageEl.querySelector('.empty')?.remove();
    }
  } catch (e) {
    console.warn(`load frames ${c.name} failed`, e);
    c.frames = [];
  }
}

async function loadSunTimes() {
  try {
    const r = await fetch(`/api/anchors?camera=${encodeURIComponent(LEFT)}`);
    const data = await r.json();
    sunTimes = {};
    for (const d of data) sunTimes[d.day] = { sunrise: d.sunrise, sunset: d.sunset };
  } catch (e) { console.warn('sun times failed', e); }
}

function computeUnion() {
  const lows = cams.map(c => c.frames[0]?.tsMs).filter(v => v != null);
  const highs = cams.map(c => c.frames[c.frames.length - 1]?.tsMs).filter(v => v != null);
  if (!lows.length || !highs.length) { unionLoTs = unionHiTs = 0; return; }
  unionLoTs = Math.min(...lows);
  unionHiTs = Math.max(...highs);
  if (userLoTs < unionLoTs || userLoTs > unionHiTs) userLoTs = unionLoTs;
  if (userHiTs <= 0 || userHiTs < unionLoTs || userHiTs > unionHiTs) userHiTs = unionHiTs;
  if (currentTs < userLoTs || currentTs > userHiTs) currentTs = userLoTs;
}

function applyRangeUI() {
  if (unionHiTs <= unionLoTs) {
    selBar.style.width = '0%';
    rangeStartLabel.textContent = '--';
    rangeEndLabel.textContent = '--';
    return;
  }
  const loPct = tsPct(userLoTs);
  const hiPct = tsPct(userHiTs);
  selBar.style.left = `${loPct}%`;
  selBar.style.width = `${Math.max(0, hiPct - loPct)}%`;
  thumbLo.style.left = `${loPct}%`;
  thumbHi.style.left = `${hiPct}%`;
  const loIso = new Date(userLoTs).toISOString();
  const hiIso = new Date(userHiTs).toISOString();
  const startStr = fmtTsHumanLocal(userLoTs);
  rangeStartLabel.textContent = startStr;
  const atCurrent = userHiTs >= unionHiTs - 500;
  rangeEndLabel.textContent = atCurrent ? `NOW (${fmtTsHumanLocal(userHiTs)})` : fmtTsHumanLocal(userHiTs);
  rangeEndLabel.style.color = atCurrent ? '#7fd17a' : '#aab';
  renderPlayhead();
  renderDayMarks();
  renderAnchors();
}

function fmtTsHumanLocal(tsMs) {
  const d = new Date(tsMs);
  const mo = d.getMonth() + 1, dd = d.getDate();
  let h = d.getHours();
  const mm = pad2(d.getMinutes()), ss = pad2(d.getSeconds());
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${mo}/${dd} ${h}:${mm}:${ss} ${ampm}`;
}

function renderPlayhead() {
  if (unionHiTs <= unionLoTs) return;
  playhead.style.left = `${tsPct(currentTs)}%`;
  currentTsLabel.textContent = fmtTsHumanLocal(currentTs);
}

function dayBoundariesInUnion() {
  const out = [];
  const start = new Date(unionLoTs);
  start.setHours(0, 0, 0, 0);
  for (let d = new Date(start); d.getTime() <= unionHiTs; d.setDate(d.getDate() + 1)) {
    if (d.getTime() >= unionLoTs && d.getTime() <= unionHiTs) {
      out.push(d.getTime());
    }
  }
  return out;
}

function renderDayMarks() {
  dayMarks.innerHTML = '';
  for (const tsMs of dayBoundariesInUnion()) {
    const s = document.createElement('span');
    s.style.left = `${tsPct(tsMs)}%`;
    dayMarks.appendChild(s);
  }
  sunMarks.innerHTML = '';
  for (const day of Object.keys(sunTimes).sort()) {
    const sun = sunTimes[day];
    if (!sun) continue;
    if (sun.sunrise) {
      const ts = tsAtDayHHMM(day, hhmmToMin(sun.sunrise));
      if (ts >= unionLoTs && ts <= unionHiTs) {
        const m = document.createElement('span');
        m.className = 'sr';
        m.style.left = `${tsPct(ts)}%`;
        sunMarks.appendChild(m);
      }
    }
    if (sun.sunset) {
      const ts = tsAtDayHHMM(day, hhmmToMin(sun.sunset));
      if (ts >= unionLoTs && ts <= unionHiTs) {
        const m = document.createElement('span');
        m.className = 'ss';
        m.style.left = `${tsPct(ts)}%`;
        sunMarks.appendChild(m);
      }
    }
  }
}

function renderAnchors() {
  anchorLabels.innerHTML = '';
  const days = Object.keys(sunTimes).sort();
  for (const day of days) {
    const sun = sunTimes[day];
    if (!sun) continue;
    const [y, mo, dd] = day.split('-').map(Number);
    const ts0 = new Date(y, mo - 1, dd).getTime();
    if (ts0 < unionLoTs - 86400000 || ts0 > unionHiTs + 86400000) continue;
    const noonTs = new Date(y, mo - 1, dd, 12, 0, 0).getTime();
    if (noonTs >= unionLoTs && noonTs <= unionHiTs) {
      const s = document.createElement('span');
      s.textContent = `${mo}/${dd}`;
      s.style.left = `${tsPct(noonTs)}%`;
      anchorLabels.appendChild(s);
    }
    if (sun.sunrise) {
      const ts = tsAtDayHHMM(day, hhmmToMin(sun.sunrise));
      if (ts >= unionLoTs && ts <= unionHiTs) {
        const s = document.createElement('span');
        s.className = 'sr-label';
        s.textContent = `↑${fmt12hm(sun.sunrise)}`;
        s.style.left = `${tsPct(ts)}%`;
        anchorLabels.appendChild(s);
      }
    }
    if (sun.sunset) {
      const ts = tsAtDayHHMM(day, hhmmToMin(sun.sunset));
      if (ts >= unionLoTs && ts <= unionHiTs) {
        const s = document.createElement('span');
        s.className = 'ss-label';
        s.textContent = `↓${fmt12hm(sun.sunset)}`;
        s.style.left = `${tsPct(ts)}%`;
        anchorLabels.appendChild(s);
      }
    }
  }
}

function applyTimelineGradient() {
  const track = document.querySelector('.rangebar .track');
  if (!track || unionHiTs <= unionLoTs) return;
  const steps = 80;
  const stops = [];
  for (let i = 0; i <= steps; i++) {
    const ts = unionLoTs + (i / steps) * (unionHiTs - unionLoTs);
    const d = new Date(ts);
    const minute = d.getHours() * 60 + d.getMinutes();
    stops.push(`${timeColor(minute)} ${(i * 100 / steps).toFixed(1)}%`);
  }
  track.style.background = `linear-gradient(to right, ${stops.join(',')})`;
}

function refreshActivePreset() {
  for (const b of rangePresets.querySelectorAll('button')) {
    b.classList.toggle('active', activePresetLabel && b.dataset.label === activePresetLabel);
  }
}

function applyPreset(loTs, hiTs, label) {
  userLoTs = Math.max(unionLoTs, loTs);
  userHiTs = Math.min(unionHiTs, hiTs);
  if (userHiTs <= userLoTs) return;
  currentTs = userLoTs;
  activePresetLabel = label || null;
  refreshActivePreset();
  applyRangeUI();
  for (const c of cams) { c.lastShownIdx = -1; }
  showAllAt(currentTs);
  playing = true;
  setPlayBtn('Pause');
}

function addPresetButton(label, cls, loTs, hiTs) {
  const btn = document.createElement('button');
  if (cls) btn.className = cls;
  btn.dataset.label = label;
  btn.textContent = label;
  btn.addEventListener('click', (e) => { e.stopPropagation(); applyPreset(loTs, hiTs, label); });
  rangePresets.appendChild(btn);
}

const SUNRISE_HEAD = 30, SUNRISE_TAIL = 60;
const DAY_PAD = 30;
const SUNSET_HEAD = 30, SUNSET_TAIL = 60;

function tsAtDayHHMM(day, minutes) {
  const [y, mo, dd] = day.split('-').map(Number);
  const h = Math.floor(minutes / 60), m = minutes % 60;
  return new Date(y, mo - 1, dd, h, m, 0).getTime();
}

function buildPresets() {
  rangePresets.innerHTML = '';
  if (unionHiTs <= unionLoTs) return;

  addPresetButton('Everything', 'preset-everything', unionLoTs, unionHiTs);

  // collect days touched by union
  const daysSeen = new Set();
  for (const c of cams) for (const f of c.frames) daysSeen.add(f.ts.slice(0, 10));
  const days = [...daysSeen].sort();
  if (!days.length) return;
  const todayKey = days[days.length - 1];

  const chrono = [];
  for (let di = 0; di < days.length; di++) {
    const day = days[di];
    const sun = sunTimes[day] || {};
    const sr = sun.sunrise ? hhmmToMin(sun.sunrise) : null;
    const ss = sun.sunset ? hhmmToMin(sun.sunset) : null;
    const md = fmtMD(day);
    if (sr !== null) {
      chrono.push({ label: `${md} sunrise`, cls: 'preset-sunrise',
        lo: tsAtDayHHMM(day, sr - SUNRISE_HEAD), hi: tsAtDayHHMM(day, sr + SUNRISE_TAIL) });
    }
    if (sr !== null && ss !== null) {
      chrono.push({ label: `${md} day`, cls: 'preset-day',
        lo: tsAtDayHHMM(day, sr + SUNRISE_TAIL), hi: tsAtDayHHMM(day, ss - DAY_PAD) });
    }
    if (ss !== null) {
      chrono.push({ label: `${md} sunset`, cls: 'preset-sunset',
        lo: tsAtDayHHMM(day, ss - SUNSET_HEAD), hi: tsAtDayHHMM(day, ss + SUNSET_TAIL) });
    }
    if (di < days.length - 1) {
      const nextDay = days[di + 1];
      const srNext = sunTimes[nextDay]?.sunrise ? hhmmToMin(sunTimes[nextDay].sunrise) : null;
      if (ss !== null && srNext !== null) {
        chrono.push({ label: `Night ${md} → ${fmtMD(nextDay)}`, cls: 'preset-night',
          lo: tsAtDayHHMM(day, ss + SUNSET_TAIL), hi: tsAtDayHHMM(nextDay, srNext - SUNRISE_HEAD) });
      }
    }
  }
  chrono.sort((a, b) => a.lo - b.lo);
  for (const b of chrono) addPresetButton(b.label, b.cls, b.lo, b.hi);

  // Today sunrise → NOW
  const todaySun = sunTimes[todayKey];
  if (todaySun?.sunrise) {
    const sr = hhmmToMin(todaySun.sunrise);
    addPresetButton(`Today (${fmtMD(todayKey)})\nsunrise → NOW`, 'preset-today',
      tsAtDayHHMM(todayKey, sr - SUNRISE_HEAD), unionHiTs);
  }

  // Last hour
  const lastHourLo = unionHiTs - 60 * 60 * 1000;
  if (lastHourLo > unionLoTs) {
    const startLbl = fmt12hm(new Date(lastHourLo).toTimeString().slice(0, 5));
    addPresetButton(`Last hour\n${startLbl} → NOW`, 'preset-today', lastHourLo, unionHiTs);
  }

  refreshActivePreset();
}

function setPlayBtn(text) { playBtn.textContent = text; }

function showAllAt(tsMs) {
  for (const c of cams) showCamAt(c, tsMs);
  renderPlayhead();
  publishMirror();
}

function showCamAt(c, tsMs) {
  if (!c.frames.length) {
    c.tsEl.textContent = '--';
    c.tsEl.classList.add('stale');
    return;
  }
  const i = nearestIdx(c.frames, tsMs);
  if (i < 0) return;
  const f = c.frames[i];
  const drift = Math.abs(f.tsMs - tsMs) / 1000;
  if (drift > NEAR_TOL_SEC) {
    c.tsEl.classList.add('stale');
    return;
  }
  c.tsEl.classList.remove('stale');
  if (i === c.lastShownIdx) {
    c.tsEl.textContent = fmtTsHuman(f.ts);
    return;
  }
  const token = ++_showToken;
  if (c.cache.ready(i)) {
    c.imgEl.src = imgUrlFor(f.name, c.name);
  } else {
    c.imgEl.src = thumbUrlFor(f.name, c.name);
    const fullImg = c.cache.ensure(f.name);
    if (fullImg) {
      const swap = () => {
        if (token !== _showToken || c.lastShownIdx !== i) return;
        c.imgEl.src = imgUrlFor(f.name, c.name);
      };
      if (fullImg.complete && fullImg.naturalWidth > 0) swap();
      else fullImg.addEventListener('load', swap, { once: true });
    }
  }
  c.lastShownIdx = i;
  c.cache.around(i, 0, c.frames.length - 1);
  c.tsEl.textContent = fmtTsHuman(f.ts);
}

let tickTimer = null;
function tick() {
  if (!playing || dragging) return;
  currentTs += ADVANCE_SEC * 1000;
  if (currentTs > userHiTs) currentTs = userLoTs;
  showAllAt(currentTs);
}

function restartTimer() {
  if (tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(tick, TICK_MS);
}

playBtn.addEventListener('click', () => {
  playing = !playing;
  setPlayBtn(playing ? 'Pause' : 'Play');
});

// Range bar interaction
function pointerToTs(clientX) {
  const rect = dual.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  return unionLoTs + pct * (unionHiTs - unionLoTs);
}

function pickActive(clientX) {
  const r = dual.getBoundingClientRect();
  const span = unionHiTs - unionLoTs;
  if (span <= 0) return 'playhead';
  const xLo = r.left + ((userLoTs - unionLoTs) / span) * r.width;
  const xHi = r.left + ((userHiTs - unionLoTs) / span) * r.width;
  const xPh = r.left + ((currentTs - unionLoTs) / span) * r.width;
  const HIT = 36;
  const cands = [
    ['playhead', Math.abs(clientX - xPh)],
    ['lo', Math.abs(clientX - xLo)],
    ['hi', Math.abs(clientX - xHi)],
  ].sort((a, b) => a[1] - b[1]);
  return cands[0][1] <= HIT ? cands[0][0] : 'playhead';
}

function showTooltip(tsMs, clientX) {
  thumbTooltip.textContent = fmtTsHumanLocal(tsMs);
  const rect = dual.getBoundingClientRect();
  thumbTooltip.style.left = `${clientX}px`;
  thumbTooltip.style.top = `${rect.top}px`;
  thumbTooltip.classList.add('show');
}
function hideTooltip() { thumbTooltip.classList.remove('show'); }

function updateDrag(clientX) {
  if (!activeDrag || unionHiTs <= unionLoTs) return;
  let v = pointerToTs(clientX);
  v = Math.max(unionLoTs, Math.min(unionHiTs, v));
  if (activeDrag === 'lo') {
    userLoTs = Math.min(v, userHiTs - 1000);
    if (currentTs < userLoTs) currentTs = userLoTs;
  } else if (activeDrag === 'hi') {
    userHiTs = Math.max(v, userLoTs + 1000);
    if (currentTs > userHiTs) currentTs = userHiTs;
  } else {
    if (v < userLoTs) userLoTs = v;
    if (v > userHiTs) userHiTs = v;
    currentTs = v;
  }
  activePresetLabel = null;
  refreshActivePreset();
  applyRangeUI();
  showAllAt(currentTs);
  const anchorTs = activeDrag === 'lo' ? userLoTs : activeDrag === 'hi' ? userHiTs : currentTs;
  showTooltip(anchorTs, clientX);
}

dual.addEventListener('pointerdown', (e) => {
  if (unionHiTs <= unionLoTs) return;
  e.preventDefault();
  try { dual.setPointerCapture(e.pointerId); } catch {}
  activeDrag = pickActive(e.clientX);
  playing = false;
  setPlayBtn('Play');
  dragging = true;
  updateDrag(e.clientX);
  const onMove = (ev) => updateDrag(ev.clientX);
  const onUp = () => {
    activeDrag = null;
    dragging = false;
    hideTooltip();
    dual.removeEventListener('pointermove', onMove);
    dual.removeEventListener('pointerup', onUp);
    dual.removeEventListener('pointercancel', onUp);
    for (const c of cams) c.cache.abortPending();
    showAllAt(currentTs);
    playing = true;
    setPlayBtn('Pause');
  };
  dual.addEventListener('pointermove', onMove);
  dual.addEventListener('pointerup', onUp);
  dual.addEventListener('pointercancel', onUp);
});

// Camera selectors
function buildSelectors() {
  for (const sel of [leftSel, rightSel]) {
    sel.innerHTML = '';
    for (const c of ALL_CAMS) {
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    }
  }
  leftSel.value = LEFT;
  rightSel.value = RIGHT;
  function navigate(l, r) {
    if (!l || !r || l === r) return;
    const q = new URLSearchParams(window.location.search);
    q.set('left', l); q.set('right', r);
    window.location.href = `/split?${q.toString()}`;
  }
  leftSel.addEventListener('change', () => {
    const l = leftSel.value;
    let r = rightSel.value;
    if (r === l) r = ALL_CAMS.find(c => c !== l) || r;
    navigate(l, r);
  });
  rightSel.addEventListener('change', () => {
    const r = rightSel.value;
    let l = leftSel.value;
    if (l === r) l = ALL_CAMS.find(c => c !== r) || l;
    navigate(l, r);
  });
  swapBtn.addEventListener('click', () => navigate(RIGHT, LEFT));
}

async function reload() {
  await Promise.all(cams.map(loadCamFrames));
  computeUnion();
  applyTimelineGradient();
  applyRangeUI();
  buildPresets();
  for (const c of cams) c.lastShownIdx = -1;
  showAllAt(currentTs);
}

const stagesEl = document.querySelector('.stages');
const FS_IDLE_MS = 60000;
let fsIdleTimer = null;

function exitFullscreen() {
  if (document.fullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
}
function enterFullscreen() {
  (stagesEl.requestFullscreen || stagesEl.webkitRequestFullscreen)?.call(stagesEl);
}
function toggleFullscreen() {
  if (document.fullscreenElement) exitFullscreen(); else enterFullscreen();
}
function resetFsIdle() {
  if (!document.fullscreenElement) return;
  clearTimeout(fsIdleTimer);
  fsIdleTimer = setTimeout(exitFullscreen, FS_IDLE_MS);
}

stagesEl.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => {
  if (document.fullscreenElement) resetFsIdle();
  else { clearTimeout(fsIdleTimer); fsIdleTimer = null; }
});
['mousemove', 'touchstart', 'click', 'keydown'].forEach(ev =>
  window.addEventListener(ev, resetFsIdle, { passive: true }));
document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    toggleFullscreen();
  }
});

// Mirror-to-TV: publish one selected cam's current frame to paired TV
const MIRROR_KEY = 'split_mirror_side';
let mirrorSide = 'left';
try {
  const stored = localStorage.getItem(MIRROR_KEY);
  if (stored === 'left' || stored === 'right') mirrorSide = stored;
} catch {}
let pairedTv = false;
const mirrorBtn = document.getElementById('mirrorBtn');
const mirrorLabel = document.getElementById('mirrorLabel');

function activeMirrorCam() { return mirrorSide === 'left' ? cams[0] : cams[1]; }

function applyMirrorUI() {
  const c = activeMirrorCam();
  mirrorLabel.textContent = `Mirror: ${c.name}`;
  cams[0].stageEl.classList.toggle('mirroring', pairedTv && mirrorSide === 'left');
  cams[1].stageEl.classList.toggle('mirroring', pairedTv && mirrorSide === 'right');
  mirrorBtn.classList.toggle('show', pairedTv);
}

function publishMirror() {
  if (!pairedTv || !window.SkyController) return;
  const c = activeMirrorCam();
  if (!c.frames.length || c.lastShownIdx < 0) return;
  const f = c.frames[c.lastShownIdx];
  if (!f) return;
  window.SkyController.publish({
    frame: f.name,
    ts: f.ts,
    camera: c.name,
    playing,
    range_lo_ts: new Date(userLoTs).toISOString().slice(0, 19),
    range_hi_ts: new Date(userHiTs).toISOString().slice(0, 19),
  });
}

mirrorBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  mirrorSide = mirrorSide === 'left' ? 'right' : 'left';
  try { localStorage.setItem(MIRROR_KEY, mirrorSide); } catch {}
  applyMirrorUI();
  publishMirror();
});

async function refreshPairStatus(myId) {
  try {
    const r = await fetch('/api/sessions', { cache: 'no-store' });
    if (!r.ok) return;
    const data = await r.json();
    const me = (data.touches || []).find(t => t.id === myId);
    const nowPaired = !!me?.paired_tv_id;
    if (nowPaired !== pairedTv) {
      pairedTv = nowPaired;
      applyMirrorUI();
      if (pairedTv) publishMirror();
    }
  } catch {}
}

(async () => {
  buildSelectors();
  await loadSunTimes();
  await reload();
  restartTimer();
  let myId = null;
  if (window.SkyController) myId = await window.SkyController.init(activeMirrorCam().name);
  await refreshPairStatus(myId);
  setInterval(() => refreshPairStatus(myId), 3000);
  setInterval(async () => { await loadSunTimes(); await reload(); }, 30000);
})();
</script>
